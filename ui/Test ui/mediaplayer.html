<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="mediaplayer.css">
    <link rel="stylesheet" href="/Res/Font/font.css">
    <title>Document</title>
</head>
<body>
    <div class="Mediaplayer-placeholder">
        <div class="Mediaplayer-cover">
            <div class="cover-overlay">
                <img class="cover-center" src="/Res/Bild/Hintergrund/Default-Banner.png">
            </div>
        </div>
        <div class="Mediaplayer-playing">
            <p style="text-align: center; font-family: JetBrains Mono;"><span id="playing-counter">0:00 | 0:00</span></p>
            <div class="Mediaplayer-playing-fill"></div>
        </div>
        <div class="Mediaplayer-box">
            <span class="Mediaplayer-title">wow sehr leer aus!</span>
            <p class="Mediaplayer-arthur">vom: <span id="Mediaplayer-arthur-id">wow sehr leer aus!</span></p>
            <div class="Mediaplayer-maincore">
                <div class="Mediaplayer-maincore-left">
                    <div class="Mediaplayer-maincore-btn"><img src="/Res/Bild/Icon/Mediaplayer/menu_24dp_FFFFFF_FILL1_wght400_GRAD0_opsz24.svg"></div>
                </div>
                <div class="Mediaplayer-maincore-center">
                    <div class="Mediaplayer-maincore-btn"><img src="/Res/Bild/Icon/Mediaplayer/skip_previous_24dp_FFFFFF_FILL1_wght400_GRAD0_opsz24.svg"></div>
                    <div class="Mediaplayer-maincore-btn"><img src="/Res/Bild/Icon/Mediaplayer/pause_24dp_FFFFFF_FILL1_wght400_GRAD0_opsz24.svg"></div>
                    <div class="Mediaplayer-maincore-btn"><img src="/Res/Bild/Icon/Mediaplayer/skip_next_24dp_FFFFFF_FILL1_wght400_GRAD0_opsz24.svg"></div>
                </div>
                <div class="Mediaplayer-maincore-right">
                    <div class="Mediaplayer-maincore-btn"><img src="/Res/Bild/Icon/Mediaplayer/shuffle_24dp_FFFFFF_FILL1_wght400_GRAD0_opsz24.svg"></div>
                </div>
            </div>
        </div>
        <div class="Mediaplayer-box-menu">
            <div class="Mediaplayer-tools">
                <div class="Mediaplayer-nutzer-hochladen-btn"><img src="/Res/Bild/Icon/Mediaplayer/upload_24dp_FFFFFF_FILL1_wght400_GRAD0_opsz24.svg"><p>Lade dein musik oder osu! dateinen!</p></div>
            </div>
            <div class="Mediaplayer-box-scroll"></div>
        </div>
    </div>
</body>
</html>
