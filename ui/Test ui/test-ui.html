<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AstrieOS - Loading</title>
    <link rel="stylesheet" href="test-ui.css">
    <link rel="stylesheet" href="/Res/Font/font.css">
</head>
<body>
    <!-- Laden-overlay -->
    <div class="Ladenoverlay" id="LadenOverlay">
        <div class="Ladencontent">
            <!-- Logo Section -->
            <div class="Ladenheader">
                <img class="Ladenlogo" src="/Res/Bild/Logo/re-ive-logo.svg" alt="AstrieOS Logo">
                <div class="Ladenlogo-glow"></div>
            </div>
            
            <!-- Loading Spinner -->
            <div class="Ladenspinner">
                <div class="spinner-ring"></div>
                <div class="spinner-ring"></div>
                <div class="spinner-ring"></div>
            </div>
            
            <!-- Progress Section -->
            <div class="Ladenprogress">
                <div class="Ladenbar-container">
                    <div class="Ladenbar" id="LadenBar"></div>
                </div>
                <span class="Laden-percent" id="Laden-nummer">0%</span>
            </div>
            
            <div class="Ladenfile-info">
                <span class="Laden-file-icon">📁</span>
                <span class="Laden-file" id="text-file">Initializing...</span>
            </div>
            
            <!-- Info Section -->
            <div class="Ladeninfo">
                <div class="Laden-passion">
                    <p>Ein passioniertes Projekt mit Liebe zum Detail</p>
                    <img src="/Res/Bild/Icon/favorite_24dp_FEC8C8_FILL1_wght400_GRAD0_opsz24.svg" alt="Heart Icon">
                </div>
                <p class="tiptext">Oct-18-2026 - Development Build | Web Client</p>
            </div>
        </div>
    </div>
    
    <script src="/JavaScript/Einstellungen.js"></script>
    <script src="/JavaScript/ui.js"></script>
    <script>
        // Lade-Overlay Animationen
        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.getElementById('LadenOverlay');
            const progressBar = document.getElementById('LadenBar');
            const percentText = document.getElementById('Laden-nummer');
            const fileText = document.getElementById('text-file');
            
            // Simuliere Ladefortschritt (kann durch echtes Laden ersetzt werden)
            let progress = 0;
            const files = ['Initializing core...', 'Loading assets...', 'Preparing UI...', 'Finalizing...'];
            let currentFile = 0;
            
            const interval = setInterval(() => {
                progress += Math.random() * 8;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    
                    // Fertig-Animation
                    setTimeout(() => {
                        overlay.classList.add('fertig');
                    }, 500);
                }
                
                progressBar.style.width = `${progress}%`;
                percentText.textContent = `${Math.floor(progress)}%`;
                
                // Dateinamen rotieren
                if (progress > currentFile * 25 && currentFile < files.length - 1) {
                    currentFile++;
                    fileText.textContent = files[currentFile];
                }
            }, 150 + Math.random() * 100);
        });
    </script>
</body>
</html>
